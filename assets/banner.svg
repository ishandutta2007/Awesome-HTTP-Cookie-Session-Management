<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cookieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-1.5deg); }
      }
      @keyframes orbitFlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarBeam {
        0% { opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { opacity: 0.2; }
      }
      .glow-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 250px 180px;
      }
      .glow-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite;
        transform-origin: 950px 220px;
      }
      .card-1 {
        animation: floatSlow1 6s ease-in-out infinite;
        transform-origin: center;
      }
      .card-2 {
        animation: floatSlow2 7.5s ease-in-out infinite;
        transform-origin: center;
      }
      .flow-path {
        stroke-dasharray: 12 12;
        animation: orbitFlow 18s linear infinite;
      }
      .pulse-dot {
        animation: radarBeam 3s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Technical Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200" />
    <path d="M100,0 V420 M200,0 V420 M300,0 V420 M400,0 V420 M500,0 V420 M600,0 V420 M700,0 V420 M800,0 V420 M900,0 V420 M1000,0 V420 M1100,0 V420" />
  </g>

  <!-- Animated Ambient Glow Spheres (Kept in Background) -->
  <circle cx="220" cy="180" r="140" fill="#3b82f6" opacity="0.25" filter="url(#glow)" class="glow-orb-1" />
  <circle cx="980" cy="200" r="160" fill="#8b5cf6" opacity="0.22" filter="url(#glow)" class="glow-orb-2" />
  <circle cx="600" cy="380" r="120" fill="#06b6d4" opacity="0.15" filter="url(#glow)" class="glow-orb-1" />

  <!-- Animated Data Orbit Flow Paths (Underneath foreground content) -->
  <path d="M 60,330 C 260,240 400,370 600,330 C 800,290 960,370 1140,310" 
        fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" class="flow-path" />
  <path d="M 80,100 C 300,160 480,50 680,100 C 880,150 1020,70 1120,110" 
        fill="none" stroke="#a855f7" stroke-width="2" opacity="0.22" class="flow-path" />

  <!-- Left Dynamic Element: Cookie Security Token Card -->
  <g class="card-1" filter="url(#cardShadow)">
    <rect x="52" y="145" width="180" height="130" rx="14" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    <!-- Cookie Icon Graphic -->
    <circle cx="95" cy="185" r="22" fill="url(#cookieGrad)" />
    <circle cx="88" cy="178" r="3" fill="#78350f" />
    <circle cx="102" cy="180" r="3.5" fill="#78350f" />
    <circle cx="92" cy="194" r="3" fill="#78350f" />
    <circle cx="104" cy="192" r="2.5" fill="#78350f" />
    <text x="126" y="191" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="15">Cookie</text>
    <rect x="72" y="222" width="60" height="18" rx="9" fill="#0369a1" opacity="0.7" />
    <text x="82" y="235" fill="#38bdf8" font-family="monospace" font-size="11">HttpOnly</text>
    <rect x="138" y="222" width="54" height="18" rx="9" fill="#15803d" opacity="0.7" />
    <text x="148" y="235" fill="#4ade80" font-family="monospace" font-size="11">Secure</text>
    <rect x="72" y="246" width="120" height="15" rx="7" fill="rgba(255,255,255,0.06)" />
    <text x="80" y="257" fill="#94a3b8" font-family="monospace" font-size="9.5">SameSite=Strict</text>
  </g>

  <!-- Right Dynamic Element: Session Token / Consent Card -->
  <g class="card-2" filter="url(#cardShadow)">
    <rect x="968" y="145" width="180" height="130" rx="14" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5" />
    <!-- Shield / Session Lock Icon Graphic -->
    <rect x="988" y="168" width="34" height="34" rx="8" fill="url(#purpleGrad)" />
    <path d="M1005,178 L1005,183 M1001,183 L1009,183 C1010,183 1011,184 1011,185 L1011,191 C1011,192 1010,193 1009,193 L1001,193 C1000,193 999,192 999,191 L999,185 C999,184 1000,183 1001,183 Z" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="1030" y="191" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="15">Session</text>
    <rect x="988" y="222" width="70" height="18" rx="9" fill="#701a75" opacity="0.7" />
    <text x="996" y="235" fill="#f472b6" font-family="monospace" font-size="11">Encrypted</text>
    <rect x="1064" y="222" width="64" height="18" rx="9" fill="#1e3a8a" opacity="0.7" />
    <text x="1072" y="235" fill="#93c5fd" font-family="monospace" font-size="11">RFC6265</text>
    <rect x="988" y="246" width="140" height="15" rx="7" fill="rgba(255,255,255,0.06)" />
    <text x="996" y="257" fill="#94a3b8" font-family="monospace" font-size="9.5">Consent: Mode v2</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Pill, Title, Subtitle, Tags (Guaranteed Clear & Legible) -->
  <g>
    <!-- Top Pill Category Indicator -->
    <g transform="translate(600, 75)">
      <rect x="-185" y="-18" width="370" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="url(#cyanGrad)" stroke-width="1.5" />
      <circle cx="-160" cy="0" r="5" fill="#38bdf8" class="pulse-dot" />
      <text x="-142" y="5" fill="#38bdf8" class="badge-label" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Prominent Main Title -->
    <text x="600" y="160" text-anchor="middle" class="title-text" fill="url(#textGrad)">
      HTTP Cookie &amp; Session Management
    </text>

    <!-- Clear Foreground Subtitle -->
    <text x="600" y="202" text-anchor="middle" class="subtitle-text">
      The authoritative landscape for Cookie Inspection, CMP Platforms &amp; Session Tooling
    </text>

    <!-- Core Feature / Topic Pills in Center Foreground -->
    <g transform="translate(600, 275)">
      <!-- Pill 1: Inspection -->
      <g transform="translate(-270, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🔍 Cookie Inspection</text>
      </g>
      <!-- Pill 2: Consent -->
      <g transform="translate(-90, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🛡️ Consent CMPs</text>
      </g>
      <!-- Pill 3: Proxies -->
      <g transform="translate(90, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#c084fc" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">⚡ Security Proxies</text>
      </g>
      <!-- Pill 4: Session Stores -->
      <g transform="translate(270, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#34d399" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🔐 Session Stores</text>
      </g>
    </g>

    <!-- Bottom Metadata Tagline -->
    <text x="600" y="350" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14" font-weight="500">
      SaaS Platforms • Developer Proxies • Frameworks &amp; Middleware • Open-Source Tools
    </text>
  </g>
</svg>
